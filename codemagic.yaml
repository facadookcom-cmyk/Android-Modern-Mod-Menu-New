workflows:
  android-mod-menu:
    name: Android Mod Menu Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
    scripts:
      - name: Install NDK
        script: |
          echo "Downloading NDK r26b..."
          curl -L -o $CM_BUILD_DIR/ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-darwin-x86_64.zip
          unzip -o $CM_BUILD_DIR/ndk.zip -d $CM_BUILD_DIR
          NDK_DIR_NAME=$(ls -d $CM_BUILD_DIR/android-ndk-* | head -n 1)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "ndk.dir=$NDK_DIR_NAME" >> "$CM_BUILD_DIR/local.properties"
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
